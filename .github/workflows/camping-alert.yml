name: Camping Availability Check

on:
  # Every 2 hours Mon–Thu between ~6 AM and 10 PM Pacific (13–05 UTC)
  schedule:
    - cron: '0 13,15,17,19,21,23,1,3 * * 1-4'
    # Friday: every 30 min all day — campgrounds release dates Thu night / Fri morning
    - cron: '0,30 13-23 * * 5'
    - cron: '0,30 0-5 * * 6'   # Fri evening runs into Sat UTC
  # Manual trigger — use this to test right now
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          playwright install chromium --with-deps

      # Restore the seen-slots DB from the most recent successful run.
      # Cache key rotates each run so the updated DB is always saved.
      - name: Restore seen-slots cache
        uses: actions/cache@v4
        with:
          path: seen_slots.db
          key: seen-slots-${{ github.run_id }}
          restore-keys: |
            seen-slots-

      - name: Run availability check
        env:
          ALERT_FROM_EMAIL: ${{ secrets.GMAIL_USER }}
          ALERT_FROM_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: sunxingshu@gmail.com
          LOOKAHEAD_WEEKS_MIN: "1"
          LOOKAHEAD_WEEKS_MAX: "24"
          MIN_SITE_LENGTH_FT: "25"
          REQUIRE_HOOKUP: "true"
          REQUIRE_DUMP_STATION: "true"
        run: python -m camping_alert.main --once
