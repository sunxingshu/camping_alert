name: Camping Availability Check

on:
  schedule:
    # Every day: 8 AM, 1 PM, 7 PM Pacific (15, 20, 02 UTC)
    - cron: '0 15,20 * * 0,1,2,3,6'   # Sun–Thu + Sat morning/afternoon
    - cron: '0 2 * * 1,2,3,4,0'        # Sun–Thu evening (02 UTC = prev-day 7 PM PT)
    # Friday: every 30 min — campgrounds release dates Thu night / Fri morning
    - cron: '0,30 13-23 * * 5'
    - cron: '0,30 0-5 * * 6'            # Fri night spills into Sat UTC

  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send a test email to verify credentials and pipeline (no real scan)'
        type: boolean
        default: false
      debug_mode:
        description: 'Log every XHR URL captured from each site (helps diagnose 0-slot issues)'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          playwright install chromium --with-deps

      # Restore the seen-slots DB from the most recent successful run.
      # Cache key rotates each run so the updated DB is always saved.
      - name: Restore seen-slots cache
        uses: actions/cache@v4
        with:
          path: seen_slots.db
          key: seen-slots-${{ github.run_id }}
          restore-keys: |
            seen-slots-

      - name: Run availability check
        env:
          ALERT_FROM_EMAIL: ${{ secrets.GMAIL_USER }}
          ALERT_FROM_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_TO_EMAIL: sunxingshu@gmail.com
          LOOKAHEAD_WEEKS_MIN: "1"
          LOOKAHEAD_WEEKS_MAX: "24"
          MIN_SITE_LENGTH_FT: "25"
          REQUIRE_HOOKUP: "true"
          REQUIRE_DUMP_STATION: "true"
          CAMPING_DEBUG: ${{ inputs.debug_mode == true && '1' || '0' }}
        run: |
          if [ "${{ inputs.test_mode }}" = "true" ]; then
            echo "Running in TEST MODE — sending test email only, no scan"
            python -m camping_alert.main --test
          else
            python -m camping_alert.main --once
          fi
